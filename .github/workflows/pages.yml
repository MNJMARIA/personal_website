name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"   # щодня: оновлює описи/дати й прибирає видалені репозиторії
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Кеш перекладу: моделі Argos (одноразове завантаження) і вже перекладені тексти
      - name: Cache translation models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-models-v1

      - name: Cache translated texts
        uses: actions/cache@v4
        with:
          path: .cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - name: Build site and projects.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
